services:
  db:
    image: postgres:16-alpine
    container_name: school_rasool_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_rasool}
      POSTGRES_USER: ${POSTGRES_USER:-school_rasool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_rasool_change_me}
    volumes:
      - school_rasool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school_rasool} -d ${POSTGRES_DB:-school_rasool}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: school_rasool_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      API_PAGE_SIZE: ${API_PAGE_SIZE:-10}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      DJANGO_DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-school_rasool}
      POSTGRES_USER: ${POSTGRES_USER:-school_rasool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_rasool_change_me}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    volumes:
      - school_rasool_static:/app/staticfiles
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    container_name: school_rasool_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  school_rasool_pgdata:
  school_rasool_static:
